<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<style>body{margin:0;background:#ffd6e7;font-family:Arial;text-align:center}.cover,.content{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center}.content{display:none;padding:20px}button{padding:15px 30px;border:none;border-radius:30px;background:#e91e63;color:#fff;font-size:20px}img{max-width:320px;border-radius:20px}</style></head><body>
<div class='cover'><h1>💌 Sebuah Pesan Untuk Novi</h1><button onclick='buka()'>Buka</button></div>
<div class='content'><img src='foto.jpg'><p>Sayang... maaf atas semua kesalahan Faris. Terima kasih sudah bertahan dan menerima Faris apa adanya. Semoga kita bisa saling menjaga, saling terbuka, dan memperbaiki semuanya bersama. ❤️</p><audio id='a' controls autoplay src='musik.mp3'></audio></div>
<script>function buka(){document.querySelector('.cover').style.display='none';document.querySelector('.content').style.display='flex';document.getElementById('a').play().catch(()=>{});}</script>
</body></html>
